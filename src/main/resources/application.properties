spring.application.name=llm-gateway
server.address=${GATEWAY_BIND_ADDRESS:127.0.0.1}
gateway.api-keys=${GATEWAY_API_KEYS:}
gateway.requests-per-minute=100
gateway.tokens-per-minute=100000
gateway.default-max-tokens=1024
gateway.cache-ttl-seconds=300
gateway.cache-max-entries=1000
gateway.max-attempts=3
gateway.backoff-millis=100
gateway.timeout-seconds=15
gateway.max-concurrent-requests=20
gateway.circuit-failure-threshold=3
gateway.circuit-cooldown-seconds=30

# Supply a full chat-completions endpoint URL and an allowed model.
gateway.providers[0].name=primary
gateway.providers[0].url=${PROVIDER_URL:}
gateway.providers[0].api-key=${PROVIDER_API_KEY:}
gateway.providers[0].model=${PROVIDER_MODEL:}
gateway.providers[0].input-price-per-million=${PROVIDER_INPUT_PRICE:0}
gateway.providers[0].output-price-per-million=${PROVIDER_OUTPUT_PRICE:0}

# Optional compatible fallback; its model overrides the primary model on failover.
gateway.providers[1].name=fallback
gateway.providers[1].url=${FALLBACK_URL:}
gateway.providers[1].api-key=${FALLBACK_API_KEY:}
gateway.providers[1].model=${FALLBACK_MODEL:}
gateway.providers[1].input-price-per-million=${FALLBACK_INPUT_PRICE:0}
gateway.providers[1].output-price-per-million=${FALLBACK_OUTPUT_PRICE:0}
